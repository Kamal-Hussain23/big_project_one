<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — RoomReady</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">Room<em>Ready</em></a>
    </div>
  </header>

  <main class="container">
    <h1>Bookings</h1>

    {% if bookings %}
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Booking #</th>
            <th>Room</th>
            <th>Guest</th>
            <th>Check-in</th>
            <th>Check-out</th>
          </tr>
        </thead>
        <tbody>
          {% for booking in bookings %}
          <tr>
            <td>{{ booking.id }}</td>
            <td>{{ booking.room_name }}</td>
            <td>{{ booking.guest_name }}</td>
            <td>{{ booking.check_in }}</td>
            <td>{{ booking.check_out }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
      <p class="placeholder">No bookings yet.</p>
    {% endif %}

    <p><a class="btn btn-link" href="{{ url_for('index') }}">Back to rooms</a></p>
  </main>
</body>
</html>
