<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking confirmed — RoomReady</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .box { border: 1px solid #2a9d3f; padding: 1rem; max-width: 30rem; }
  </style>
</head>
<body>
  <h1>Booking confirmed</h1>
  <div class="box">
    <p><strong>Room:</strong> {{ booking.room_name }}</p>
    <p><strong>Guest:</strong> {{ booking.guest_name }}</p>
    <p><strong>Check-in:</strong> {{ booking.check_in }}</p>
    <p><strong>Check-out:</strong> {{ booking.check_out }}</p>
    <p><strong>Booking #:</strong> {{ booking.id }}</p>
  </div>
  <p><a href="{{ url_for('index') }}">Back to rooms</a></p>
</body>
</html>
