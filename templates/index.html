<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomReady</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">Room<em>Ready</em></a>
    </div>
  </header>

  <main class="container">
    <h1>Book a room</h1>
    <p>Pick your dates to see the rooms that are free, then book one.</p>

    <form method="get" action="/" class="card">
      <div class="form-row">
        <div class="field">
          <label class="field-label" for="search-check-in">Check-in</label>
          <input type="date" id="search-check-in" name="check_in" value="{{ check_in }}">
        </div>
        <div class="field">
          <label class="field-label" for="search-check-out">Check-out</label>
          <input type="date" id="search-check-out" name="check_out" value="{{ check_out }}">
        </div>
        <button type="submit" class="btn btn-primary">Check availability</button>
      </div>
    </form>

    {% if check_in %}
      <p class="note">Rooms free from {{ check_in }} to {{ check_out }}:</p>
    {% endif %}

    {% for room in rooms %}
    <div class="card room-card">
      <div class="room-top">
        <h2>{{ room.name }}</h2>
        <span class="price">&pound;{{ "%.2f"|format(room.price) }} <span>per night</span></span>
      </div>
      <p class="description">{{ room.description }}</p>

      <form class="book-form" data-room-id="{{ room.id }}">
        <div class="form-row">
          <div class="field">
            <label class="field-label" for="guest-{{ room.id }}">Name</label>
            <input type="text" id="guest-{{ room.id }}" name="guest_name" required>
          </div>
          <div class="field">
            <label class="field-label" for="check-in-{{ room.id }}">Check-in</label>
            <input type="date" id="check-in-{{ room.id }}" name="check_in" required>
          </div>
          <div class="field">
            <label class="field-label" for="check-out-{{ room.id }}">Check-out</label>
            <input type="date" id="check-out-{{ room.id }}" name="check_out" required>
          </div>
          <button type="submit" class="btn btn-success">Book this room</button>
        </div>
      </form>
    </div>
    {% endfor %}
  </main>

  <script>
    const forms = document.querySelectorAll('.book-form');
    forms.forEach(function (form) {
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const roomId = form.dataset.roomId;
        const data = new FormData(form);
        fetch('/book/' + roomId, { method: 'POST', body: data })
          .then(function (response) {
            if (response.ok) {
              window.location.href = response.url;
            } else {
              alert('Something went wrong. Please try again.');
            }
          })
          .catch(function () {
            alert('Something went wrong. Please try again.');
          });
      });
    });
  </script>
</body>
</html>
