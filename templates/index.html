<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomReady</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .room { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
    label { display: inline-block; margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>RoomReady</h1>
  <p>Pick a room and book it.</p>

  <form method="get" action="/">
    <label>Check-in
      <input type="date" name="check_in" value="{{ check_in }}">
    </label>
    <label>Check-out
      <input type="date" name="check_out" value="{{ check_out }}">
    </label>
    <button type="submit">Check availability</button>
  </form>

  {% if check_in %}
    <p>Rooms free from {{ check_in }} to {{ check_out }}:</p>
  {% endif %}

  {% for room in rooms %}
  <div class="room">
    <h2>{{ room.name }}</h2>
    <p>&pound;{{ "%.2f"|format(room.price) }} per night</p>
    <p>{{ room.description }}</p>

    <form class="book-form" data-room-id="{{ room.id }}">
      <label>Name
        <input type="text" name="guest_name" required>
      </label>
      <label>Check-in
        <input type="date" name="check_in" required>
      </label>
      <label>Check-out
        <input type="date" name="check_out" required>
      </label>
      <button type="submit">Book this room</button>
    </form>
  </div>
  {% endfor %}

  <script>
    const forms = document.querySelectorAll('.book-form');
    forms.forEach(function (form) {
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const roomId = form.dataset.roomId;
        const data = new FormData(form);
        fetch('/book/' + roomId, { method: 'POST', body: data })
          .then(function (response) {
            if (response.ok) {
              window.location.href = response.url;
            } else {
              alert('Something went wrong. Please try again.');
            }
          })
          .catch(function () {
            alert('Something went wrong. Please try again.');
          });
      });
    });
  </script>
</body>
</html>
